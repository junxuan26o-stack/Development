<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Fonts Typography Hierarchy</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="medium_google_fonts.css">
</head>
<body>

<article>
    <h1>Main Article Title</h1>
    <p class="subtitle">Article subtitle or introduction</p>
    <p>First paragraph of content...</p>
    <h2>First Section Heading</h2>
    <p>More content...</p>

    <blockquote class="pull-quote">
        This is an important pull quote from the article
    </blockquote>

<h3>Subsection Heading</h3>

<p>Additional content...</p>

<h4>Minor Heading</h4>

<p>Final content section...</p>

</article>
</body>
</html>
