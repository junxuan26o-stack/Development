<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.grid-container{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 90px);
    gap: 8px;
    
}
.grid-item{
    display: flex;
    justify-content: center;
    align-items: center;
}
.grid-item.odd{
    background-color: lightblue;
    border: 2px solid black;

}
.grid-item.even{
    background-color: lightgreen;
    border: 2px solid black;
}

</style>
<body>
    
    <div class="grid-container">
        <div class="grid-item odd">1</div>
        <div class="grid-item even">2</div>
        <div class="grid-item odd">3</div>
        <div class="grid-item even">4</div>
        <div class="grid-item odd">5</div>
        <div class="grid-item even">6</div>
        <div class="grid-item odd">7</div>
        <div class="grid-item even">8</div>
    </div>

</body>
</html>
